# Builds the website (tools/make_site.py) and publishes it on GitHub Pages at
# thinkingplace.app, on every upload to main, and once a day so the Library pages show each
# thought once its day has passed. site/ itself stays out of git. GitHub pauses scheduled runs
# after 60 days without a commit to the repository; an upload starts them again.
name: Website

on:
  push:
    branches: [main]
  schedule:
    - cron: "20 0 * * *"  # every day at 00:20 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/make_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
